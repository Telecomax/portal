<script>

}
function hideLoginBuffer(){
  const box=document.getElementById('loginBuffer');
  if(box){box.classList.remove('show');box.setAttribute('aria-hidden','true');}
}
function showBuffer(message='Loading...'){showLoginBuffer(message)}

const SCRIPT_URL='/_legacy/km';
const $=id=>document.getElementById(id); let managementToken=sessionStorage.getItem('tmx_km_finance_token')||'', managementName=sessionStorage.getItem('tmx_km_finance_name')||''; let trips=[]; let filterCombos=[]; let configEngineers=[]; let photosVisible=localStorage.getItem('finance_portal_photos')!=='0';
function toast(s){const e=$('toast');e.textContent=s;e.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>e.style.display='none',2600)}
async function post(action,extra={}){const r=await TMX.fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action,managementToken,...extra})});const text=await r.text();let d;try{d=JSON.parse(text)}catch(e){throw Error('bad-response')}if(!d.ok)throw Error(d.error||'server-error');return d}
function uniqueSorted(values){return [...new Set(values.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)))}
function relationContext(prefix=''){
  const ids=prefix?{engineer:'sEngineer',driver:'sDriver',project:'sProject',paidBy:'sPaidBy'}:{engineer:'engineer',driver:'driver',project:'project',paidBy:'paidBy'};
  const out={};Object.keys(ids).forEach(k=>out[k]=String($(ids[k])?.value||'').trim().toLowerCase());
  const monthEl=$(prefix?'sMonth':'month');
  out.months=String(monthEl?.value||'').split(',').map(x=>x.trim()).filter(Boolean);
  return out;
}
function relationalOptions(kind,prefix=''){
  const q=relationContext(prefix);
  const rows=filterCombos.filter(r=>{
    if(q.months.length && !q.months.includes(String(r.month||'')))return false;
    for(const k of ['engineer','driver','project','paidBy']){
      if(k===kind||!q[k])continue;
      if(String(r[k]||'').trim().toLowerCase()!==q[k])return false;
    }
    return true;
  });
  if(kind==='paidBy'){
    // Paid By master list ALWAYS comes from KM Config Column A.
    // Only narrow it when another relational filter is actually selected.
    const hasOtherFilter=q.months.length>0||['engineer','driver','project'].some(k=>q[k]);
    if(!hasOtherFilter) return uniqueSorted(configEngineers);
    const allowed=new Set(rows.map(r=>String(r.paidBy||'').trim().toLowerCase()).filter(Boolean));
    return uniqueSorted(configEngineers.filter(e=>allowed.has(String(e).trim().toLowerCase())));
  }
  return uniqueSorted(rows.map(r=>r[kind]));
}
function drawRelOptions(inputId,optsId,kind,prefix=''){
  const inp=$(inputId),box=$(optsId),q=inp.value.trim().toLowerCase();
  const vals=relationalOptions(kind,prefix).filter(x=>!q||String(x).toLowerCase().includes(q)).slice(0,100);
  box.innerHTML=vals.map(x=>`<div class="opt" data-v="${esc(x)}">${esc(x)}</div>`).join('')||'<div class="opt muted">No related matches</div>';box.style.display='block';
}
function sanitizeRelational(changedKind,prefix=''){
  const ids=prefix?{engineer:'sEngineer',driver:'sDriver',project:'sProject',paidBy:'sPaidBy'}:{engineer:'engineer',driver:'driver',project:'project',paidBy:'paidBy'};
  for(const k of ['engineer','driver','project','paidBy']){
    if(k===changedKind)continue;const el=$(ids[k]);if(!el||!el.value.trim())continue;
    const allowed=relationalOptions(k,prefix).map(v=>String(v).trim().toLowerCase());
    if(!allowed.includes(el.value.trim().toLowerCase()))el.value='';
  }
}
function wireRelationalSearch(inputId,optsId,kind,prefix=''){
  const inp=$(inputId),box=$(optsId);
  const draw=()=>drawRelOptions(inputId,optsId,kind,prefix);
  inp.addEventListener('focus',draw);inp.addEventListener('input',draw);
  box.addEventListener('mousedown',e=>{const o=e.target.closest('[data-v]');if(!o)return;inp.value=o.dataset.v;box.style.display='none';sanitizeRelational(kind,prefix)});
  document.addEventListener('click',e=>{if(!e.target.closest('#'+inputId)&&!e.target.closest('#'+optsId))box.style.display='none'});
}
async function loadLists(){try{const d=await post('financeFilterOptions');filterCombos=d.combinations||[];configEngineers=d.engineers||[];
  [['engineer','engineerOpts','engineer',''],['driver','driverOpts','driver',''],['project','projectOpts','project',''],['paidBy','paidByOpts','paidBy',''],
   ['sEngineer','sEngineerOpts','engineer','s'],['sDriver','sDriverOpts','driver','s'],['sProject','sProjectOpts','project','s'],['sPaidBy','sPaidByOpts','paidBy','s']]
   .forEach(x=>wireRelationalSearch(x[0],x[1],x[2],x[3]));
}catch(e){toast('Could not load filter lists')}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function setAuthed(on){document.documentElement.classList.toggle('finance-unauthenticated',!on);$('loginView').style.display=on?'none':'block';$('dash').style.display=on?'block':'none';$('logoutBtn').style.display=on?'inline-block':'none';$('sessionLabel').textContent=on?'Finance':' ';if(on){loadLists();$('tableWrap').innerHTML='<div class="empty">Apply filters to load trips.</div>'}}
$('loginBtn').onclick=async()=>{const name=$('name').value.trim(),pin=$('pin').value.trim();if(!name||!pin)return toast('Enter your name and 4-digit PIN');showLoginBuffer('Logging in to Finance...');$('loginBtn').disabled=true;try{const d=await post('managementLogin',{name,pin,portalRole:'Finance'});managementToken=d.token;managementName=d.name||name;sessionStorage.setItem('tmx_km_finance_token',managementToken);sessionStorage.setItem('tmx_km_finance_name',managementName);setAuthed(true);toast('Logged in as '+managementName)}catch(e){managementToken='';toast(e.message||'Could not verify — check connection')}finally{$('loginBtn').disabled=false;hideLoginBuffer()}};
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')$('pin').focus()});
$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});
$('logoutBtn').onclick=()=>{managementToken='';managementName='';sessionStorage.removeItem('tmx_km_finance_token');sessionStorage.removeItem('tmx_km_finance_name');$('name').value='';$('pin').value='';setAuthed(false)};
let v832FinanceTotal=0,v832FinanceHasMore=false,v832FinanceTotals={};
async function loadTrips(mode='reset'){
 if(!managementToken)return;

 const append=mode==='more',loadAll=mode==='all',offset=append?trips.length:0;
 showBuffer(loadAll?'Loading all matching trips...':append?'Loading 31 more trips...':'Applying filters...');
 if(!append)$('tableWrap').innerHTML='<div class="empty">Loading audit records…</div>';
 try{
   const d=await post('financeTrips',{filterEngineer:$('engineer').value.trim(),filterDriver:$('driver').value.trim(),filterProject:$('project').value.trim(),filterMonth:$('month').value,filterPaidBy:$('paidBy').value,filterAuditStatus:$('auditStatus').value,auditRole:'Finance',offset,limit:31,loadAll});
   trips=append?trips.concat(d.trips||[]):(d.trips||[]);
   v832FinanceTotal=Number(d.totalMatched||0);v832FinanceHasMore=!!d.hasMore;v832FinanceTotals=d.totals||{};
   render(v832FinanceTotal);v832RenderFinancePager();
 }catch(e){if(e.message==='finance-session-required'){managementToken='';managementName='';sessionStorage.removeItem('tmx_km_finance_token');sessionStorage.removeItem('tmx_km_finance_name');setAuthed(false)}else{console.error('Photo Audit load failed:',e);$('tableWrap').innerHTML='<div class="empty">Could not load audit records: '+esc(e.message||'server-error')+'</div>'}}
 finally{hideBuffer()}
}
function v832RenderFinancePager(){
 let x=document.getElementById('v832FinancePager');if(x)x.remove();
 const wrap=document.createElement('div');wrap.id='v832FinancePager';wrap.className='v832-pager';
 wrap.innerHTML='<span class="countx">Showing '+trips.length+' of '+v832FinanceTotal+' trips</span>'+(v832FinanceHasMore?'<button class="btn" onclick="loadTrips(&quot;more&quot;)">Load More 31</button><button class="btn" onclick="v832LoadAllFinance()">Load All</button>':'');
 $('tableWrap').insertAdjacentElement('afterend',wrap);
}
function v832LoadAllFinance(){if(v832FinanceTotal>500&&!confirm('Load all '+v832FinanceTotal+' matching trips?'))return;loadTrips('all')}
function render(totalMatched){
  const z=v832FinanceTotals||{};
  $('tripCount').textContent=Number(z.trips||totalMatched||0);
  $('tripKm').textContent=Number(z.tripKm||0).toFixed(0);
  $('totalKm').textContent=Number(z.totalKm||0).toFixed(0);
  $('amount').textContent=Number(z.amountSpent||0).toFixed(2)+' EGP';
  $('matched').textContent=totalMatched>trips.length?`(${trips.length} of ${totalMatched})`:`(${trips.length})`;
  if(!trips.length){$('tableWrap').innerHTML='<div class="empty">No trips match these filters.</div>';return}
  const cards=trips.map(t=>`<article class="audit-card audit" data-audit-trip="${esc(t.tripId)}">
    <div class="trip-summary summary compact-trip-info">
      ${summary('Date',esc(t.date))}
      ${summary('Engineer',esc(t.engineer||'—'))}
      ${summary('Driver',esc(t.driver||'—'))}
      ${summary('Project',esc(t.projectName||'—'))}
      ${summary('Area',esc(t.area||'—'))}
      ${summary('Task',esc(t.task||'—'))}
    </div>
    <div class="trip-metrics metrics compact-trip-metrics">
      
      ${metric('Trip KM',num(t.tripKm).toFixed(0))}
      ${metric('F&B',num(t.forthBack).toFixed(0))}
      ${metric('Total KM',num(t.totalKm).toFixed(0))}
      ${metric('Static Hours',num(t.staticHours)+' h')}
      ${metric('Rate',esc(t.rateDisplay||'22.25 EGP / 10 KM'))}${metric('Amount',num(t.amountSpent).toFixed(2)+' EGP','amount')}
    </div>
    <div class="audit-actions"><input class="audit-check" type="checkbox" data-trip="${esc(t.tripId)}" ${t.financeStatus==='Approved'||t.financeStatus==='Rejected'?'disabled':''}><span class="status-badge status-${String(t.pmStatus||'Pending').toLowerCase()}">PM: ${esc(t.pmStatus||'Pending')}</span><span class="status-badge status-${String(t.financeStatus||'Pending').toLowerCase()}">Finance: ${esc(t.financeStatus||'Pending')}</span><button class="btn edit-km" data-trip="${esc(t.tripId)}" data-start="${t.startKm}" data-finish="${t.finishKm}">Edit KM</button><button class="btn deduct" data-trip="${esc(t.tripId)}">Deduct</button><button class="btn danger reject" data-trip="${esc(t.tripId)}">Reject</button></div>
    <div class="photo-pair photos">
      ${photoPanel(t.startPhotoThumb,t.startPhoto,t.startLatitude,t.startLongitude,'Start Photo',t.startKm,'start')}
      ${photoPanel(t.finishPhotoThumb,t.finishPhoto,t.finishLatitude,t.finishLongitude,'Finish Photo',t.finishKm,'finish')}
    </div>
  </article>`).join('');
  $('tableWrap').innerHTML='<div class="audit-list">'+cards+'</div>';
  applyPhotos();
}


$('apply').onclick=loadTrips;
$('refreshBtn').onclick=loadTrips;$('photosBtn').onclick=()=>{photosVisible=!photosVisible;localStorage.setItem('finance_portal_photos',photosVisible?'1':'0');applyPhotos();};
$('clear').onclick=()=>{
  $('engineer').value='';$('driver').value='';$('project').value='';$('month').value='';

};

let auditDialogResolve=null;
function auditDialog(title,text,fieldsHtml){
  const bg=$('auditDialogBg');
  $('auditDialogTitle').textContent=title;
  $('auditDialogText').textContent=text||'';
  $('auditDialogFields').innerHTML=fieldsHtml||'';
  bg.classList.add('open');
  return new Promise(resolve=>auditDialogResolve=resolve);
}
function closeAuditDialog(value){
  const bg=$('auditDialogBg'); if(bg) bg.classList.remove('open');
  if(auditDialogResolve){const r=auditDialogResolve;auditDialogResolve=null;r(value)}
}
document.addEventListener('click',e=>{
  if(e.target && e.target.id==='auditDialogCancel') closeAuditDialog(null);
  if(e.target && e.target.id==='auditDialogConfirm'){
    const vals={};
    $('auditDialogFields').querySelectorAll('[data-dlg]').forEach(x=>vals[x.dataset.dlg]=x.value);
    closeAuditDialog(vals);
  }
  if(e.target && e.target.id==='auditDialogBg') closeAuditDialog(null);
});

const stagedAudit={};
function stagedCount(){return Object.keys(stagedAudit).length}
function updatePendingLabel(){$('pendingChanges').textContent=stagedCount()?stagedCount()+' unsaved change(s)':'No unsaved changes'}
function stageTrip(id,patch){stagedAudit[id]=Object.assign(stagedAudit[id]||{tripId:id},patch);updatePendingLabel();let c=auditCard(id);if(c)c.dataset.dirty='1'}
function auditCard(id){return [...document.querySelectorAll('[data-audit-trip]')].find(x=>String(x.dataset.auditTrip)===String(id))||null}
function markLocalStatus(id,status){
  let c=auditCard(id);if(!c)return;
  let b=[...c.querySelectorAll('.audit-actions b')][0];if(b)b.textContent='Finance: '+status;
  let cb=c.querySelector('.audit-check');if(cb&&status==='Rejected'){cb.checked=false;cb.disabled=true}
}
async function saveStagedAudit(showToast=true){
 const updates=Object.values(stagedAudit);
 if(!updates.length){if(showToast)toast('No changes to save');return true}
 showBuffer('Saving changes...');
 try{
   let r=await post('financeSaveAuditBatch',{updates});if(!r.ok)throw new Error(r.error||'Save failed');
   Object.keys(stagedAudit).forEach(k=>delete stagedAudit[k]);
   document.querySelectorAll('[data-dirty="1"]').forEach(c=>delete c.dataset.dirty);
   updatePendingLabel();if(showToast)toast('Changes saved');return true
 }catch(e){console.error(e);toast('Could not save changes: '+(e.message||'server error'));return false}
 finally{hideBuffer()}
}
$('selectAllAudit').onclick=()=>document.querySelectorAll('.audit-check:not(:disabled)').forEach(x=>x.checked=true);
$('saveAudit').onclick=()=>saveStagedAudit(true);
$('approveAudit').onclick=async()=>{
 let ids=[...document.querySelectorAll('.audit-check:checked:not(:disabled)')].map(x=>x.dataset.trip);
 if(!ids.length)return toast('Select pending trips first');
 let ok=await saveStagedAudit(false);if(!ok)return;
 showBuffer('Approving selected trips...');
 try{
   let r=await post('financeSaveAuditBatch',{updates:[],approvals:ids});if(!r.ok)throw new Error(r.error||'Approval failed');
   toast(ids.length+' trips approved');await loadTrips();
 }catch(e){toast('Could not approve selected trips: '+(e.message||'server error'))}
 finally{hideBuffer()}
};

function applyPhotos(){
  document.querySelectorAll('.audit-photo').forEach(img=>{
    img.onclick=()=>{
      const full=img.dataset.full||img.src;if(!full)return;
      const lb=$('lightbox'),lbImg=$('lightboxImg')||$('lbImg');
      if(lbImg)lbImg.src=full;if(lb)lb.classList.add('open');else window.open(full,'_blank');
    };
  });
  document.querySelectorAll('.photo-panel').forEach(x=>x.style.display=photosVisible?'':'none');
  const btn=$('photosBtn');if(btn)btn.textContent=photosVisible?'Hide Photos':'View Photos';
}


function summary(label,value){return `<div class="cell summary-item"><b>${label}</b><span>${value}</span></div>`}
function metric(label,value,cls=''){return `<div class="metric ${cls}"><b>${label}</b>${value}</div>`}
function photoPanel(thumb,full,lat,lng,label,km,kind){
  const src=thumb||full||'';
  const fullSrc=full||thumb||'';
  const media=src?`<img class="audit-photo" src="${esc(src)}" data-full="${esc(fullSrc)}" alt="${esc(label)}">`:'<div class="photo-missing">No photo available</div>';
  return `<section class="photo-panel photo"><div class="photo-title">${esc(label)} <span class="photo-km" data-photo-km="${kind}">${esc(km||'—')}</span></div><div class="photo-frame frame" data-evidence-side="${kind}">${media}</div><div class="gps">GPS: ${lat!==''&&lat!=null&&lng!==''&&lng!=null?esc(lat)+', '+esc(lng):'—'}</div></section>`;
}
$('tableWrap').addEventListener('click',async e=>{
 let b=e.target.closest('button');if(!b)return;let id=b.dataset.trip,c=auditCard(id);if(!c)return;
 if(b.classList.contains('reject')){
   let v=await auditDialog('Reject Trip','Enter the reason for rejecting this trip.','<label>Reason</label><textarea data-dlg="reason" placeholder="Rejection reason"></textarea>');if(!v)return;
   stageTrip(id,{status:'Rejected',reason:v.reason||''});markLocalStatus(id,'Rejected');toast('Rejected locally — click Save Changes');
 } else if(b.classList.contains('deduct')){
   let current=(stagedAudit[id]&&stagedAudit[id].deduction)||0;
   let v=await auditDialog('Deduct Amount','Enter the amount to deduct from this trip.','<label>Deduction (EGP)</label><input data-dlg="deduction" type="number" min="0" step="0.01" value="'+current+'">');if(!v)return;

<script id="tmxUniversalAuthResolveEndV8221">
(function(){
 const root=document.documentElement;
 if(!root.classList.contains('tmx-auth-resolving')) return;
 function hasSession(){ return !!(sessionStorage.getItem('tmx_km_finance_token')); }
 function loginVisible(){
   const ids=['loginBtn', 'loginBuffer', 'loginBufferText', 'loginView'];
   for(const id of ids){
     const e=document.getElementById(id);
     if(e && getComputedStyle(e).display!=='none' && getComputedStyle(e).visibility!=='hidden') return true;
   }
   return false;
 }
 function revealIfReady(){
   if(hasSession()){
     // Wait one frame so the page's own auth routine can switch from login to app.
     requestAnimationFrame(()=>requestAnimationFrame(()=>root.classList.remove('tmx-auth-resolving')));
     return true;
   }
   return false;
 }
 if(!revealIfReady()){
   const mo=new MutationObserver(()=>{if(revealIfReady())mo.disconnect()});
   if(document.body) mo.observe(document.body,{subtree:true,childList:true,attributes:true});
   // Genuine auth failure: restore existing legacy login fallback.
   setTimeout(()=>{root.classList.remove('tmx-auth-resolving');mo.disconnect()},12000);
 }
})();
</script>
