<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App Rates — Telecomax</title><style>
:root{--bg:#f4f6f8;--panel:#fff;--panel2:#f8fafc;--line:#d9dee7;--text:#243042;--muted:#6f7b8c;--brand:#b52d7b;--soft:#f8eaf2;--good:#2f855a;--warn:#a66b18;--shadow:0 4px 16px rgba(31,45,61,.055)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,Segoe UI,Arial,sans-serif}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;position:sticky;top:0;z-index:20}.brand{font-size:22px;font-weight:850}.brand:before{content:"";display:inline-block;width:6px;height:24px;background:var(--brand);margin-right:12px;vertical-align:-5px;border-radius:4px}.brand small{font-size:14px;font-weight:500;color:var(--muted);margin-left:10px}.actions{margin-left:auto}.wrap{max-width:1540px;margin:auto;padding:26px}.login{max-width:440px;margin:90px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}.dash{display:none}.btn{border:1px solid var(--line);background:#fff;color:#344054;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:750}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.logout{background:var(--soft);border-color:#e7bdd4;color:#9c286a}.input,select{width:100%;height:44px;background:#fff;border:1px solid #ccd3dd;border-radius:10px;padding:0 12px;color:var(--text)}label{display:block;color:#697586;font-size:12px;font-weight:800;text-transform:uppercase;margin:12px 0 6px}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{padding:11px 16px}.tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}.panel{display:none}.panel.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}.filters{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr)) auto;gap:12px;align-items:end}.search{position:relative}.opts{display:none;position:absolute;left:0;right:0;top:48px;max-height:260px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;z-index:30;box-shadow:0 12px 30px #0002}.opt{padding:10px 12px;cursor:pointer}.opt:hover{background:var(--soft)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.stat .k{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:800}.stat .v{font-size:24px;font-weight:850;margin-top:4px}.accent .v{color:var(--brand)}.audit-list{display:flex;flex-direction:column;gap:18px}.audit{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.summary{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--line)}.cell{padding:12px;border-right:1px solid #edf0f3}.cell b{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}.metrics{display:grid;grid-template-columns:repeat(6,1fr);background:var(--panel2)}.metric{text-align:center;padding:12px}.metric b{display:block;font-size:10px;color:var(--muted);text-transform:uppercase}.photos{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px}.photo{text-align:center}.frame{height:390px;background:#eef1f5;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}.frame img{width:100%;height:100%;object-fit:contain;cursor:zoom-in}.empty{text-align:center;color:var(--muted);padding:35px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:11px;text-transform:uppercase;color:var(--muted)}.totalcard{padding:18px;border-radius:14px;background:var(--soft);text-align:center;margin:14px 0}.totalcard .v{font-size:28px;font-weight:900;color:var(--brand)}.lightbox{display:none;position:fixed;inset:0;background:#111d;z-index:100;align-items:center;justify-content:center;padding:30px}.lightbox.open{display:flex}.lightbox img{max-width:94vw;max-height:90vh}.toast{display:none;position:fixed;right:20px;bottom:20px;background:#273142;color:#fff;padding:12px 16px;border-radius:10px;z-index:120}@media(max-width:900px){.filters,.grid2,.grid3,.photos{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.summary,.metrics{grid-template-columns:repeat(2,1fr)}.frame{height:320px}}

/* Login buffering overlay */
.login-buffer-overlay{
  position:fixed;inset:0;z-index:99999;display:none;
  align-items:center;justify-content:center;
  background:rgba(15,23,42,.38);backdrop-filter:blur(2px);
}
.login-buffer-overlay.show{display:flex}
.login-buffer-box{
  min-width:220px;max-width:86vw;padding:24px 28px;border-radius:18px;
  background:#fff;box-shadow:0 18px 55px rgba(15,23,42,.22);
  text-align:center;color:#1f2937;font-weight:800;
}
.login-buffer-spinner{
  width:42px;height:42px;margin:0 auto 14px;border-radius:50%;
  border:4px solid #e5e7eb;border-top-color:#2563eb;
  animation:loginSpin .75s linear infinite;
}
.login-buffer-text{font-size:15px}
@keyframes loginSpin{to{transform:rotate(360deg)}}

.audit-actions,.bulkbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px}.audit-actions{border-top:1px solid var(--line)}.bulkbar{position:sticky;bottom:8px;background:#fff;border:1px solid var(--line);border-radius:12px;justify-content:flex-end}.summary-table{width:100%;border-collapse:collapse}.summary-table th,.summary-table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}.danger{border-color:#e6b4b4;color:#a52a2a}.audit[data-dirty="1"]{outline:2px solid #d29b2d}.deduction-note{font-weight:700;color:#a35a00}
.photo-title{display:flex!important;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.photo-km{font-weight:900;color:#172b43;background:#fff;border:1px solid #d9e1e8;border-radius:8px;padding:3px 9px}.edited-km{display:block;font-size:11px;color:#147a45;margin-top:3px;font-weight:800}.audit-dialog-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:none;align-items:center;justify-content:center;padding:18px}.audit-dialog-bg.open{display:flex}.audit-dialog{width:min(100%,440px);background:#fff;border-radius:18px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.audit-dialog h3{margin:0 0 8px}.audit-dialog p{color:#667085;margin:0 0 15px}.audit-dialog .dlg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.audit-dialog input,.audit-dialog textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d6dde5;border-radius:10px;margin:5px 0 10px}.audit-dialog textarea{min-height:80px;resize:vertical}.audit-dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:8px}

.sso-status{position:fixed;inset:0;z-index:999999;background:rgba(2,8,23,.92);display:flex;align-items:center;justify-content:center;padding:24px}
.sso-status-box{max-width:430px;width:100%;padding:24px;border-radius:20px;background:#0b1020;border:1px solid rgba(255,255,255,.15);color:#fff;text-align:center}
.sso-status-box b{display:block;font-size:20px;margin-bottom:8px}.sso-status-box span{color:#aab4c4}

[hidden]{display:none!important}.rate-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.rate-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.rate-value{font-size:23px;font-weight:800;margin:16px 0}.rate-actions{display:flex;gap:8px}.btn:disabled{opacity:.45;cursor:default}dialog{border:1px solid var(--line);border-radius:18px;width:min(560px,92vw);padding:24px;color:var(--text)}dialog::backdrop{background:#00101d99}dialog label{margin-top:12px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
</style></head><body><header class="top"><div class="brand">TELECOMAX <small>Admin Portal</small></div><div class="actions"><a class="btn" href="index.html">Portal</a></div></header>
<main class="wrap"><h1>App Rates</h1><div class="rate-tabs" role="tablist"><button class="btn primary" data-kind="KM">KM Rates</button><button class="btn" data-kind="Engineer">Engineers Allowances</button><button class="btn" data-kind="Driver">Driver Allowances</button></div>
<div class="card"><p>Current rates remain in history. Edit a current rate to schedule future values; only unused future schedules can be deleted.</p><button id="addRate" class="btn primary">Add future rate</button> <button id="refreshRates" class="btn">Refresh</button><p id="rateMessage" role="status"></p></div><section id="rateRows" class="rate-grid"></section></main>
<dialog id="rateEditor"><h2 id="rateTitle">Schedule rate</h2><form id="rateForm"><div id="kmFields"><label for="rateProject">Project</label><select id="rateProject"></select><div class="grid2"><div><label for="rateAmount">Amount (EGP)</label><input class="input" id="rateAmount" type="number" min="0.000001" step="any"></div><div><label for="rateDistance">Distance (KM)</label><input class="input" id="rateDistance" type="number" min="0.000001" step="any"></div></div><p class="muted">Example: 22.25 EGP per 9 KM → amount 22.25, distance 9.</p></div>
<div id="allowanceFields"><label for="rateNormal">Normal allowance (EGP)</label><input class="input" id="rateNormal" type="number" min="0" max="100000" step="any"><label for="rateFriday">Friday allowance (EGP)</label><input class="input" id="rateFriday" type="number" min="0" max="100000" step="any"><label for="rateSaturday">Saturday allowance (EGP)</label><input class="input" id="rateSaturday" type="number" min="0" max="100000" step="any"></div>
<label for="rateDate">Effective from</label><input class="input" id="rateDate" type="date" required><div class="dialog-actions"><button type="button" id="rateCancel" class="btn">Cancel</button><button id="rateSave" class="btn primary">Save</button></div></form></dialog><script type="module" src="/tmx/app-rates.js"></script></body></html>
